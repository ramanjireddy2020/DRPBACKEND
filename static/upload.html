<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload CSV</title>
</head>
<body>
    <h1>Upload CSV File and Search Keywords</h1>
    <form id="upload-form" action="/api/v1/upload-protien-csv/" method="post" enctype="multipart/form-data">
        <label for="file">Select CSV file:</label>
        <input type="file" id="file" name="file" accept=".csv" required>
        <br><br>
        <label for="keywords">Enter keywords (comma-separated):</label>
        <input type="text" id="keywords" name="keywords" required>
        <br><br>
        <button type="button" onclick="uploadFile()">Upload</button>
    </form>
    <div id="response"></div>

    <script>
        async function uploadFile() {
            const form = document.getElementById('upload-form');
            const formData = new FormData(form);
            const response = await fetch(form.action, {
                method: 'POST',
                body: formData
            });
            const result = await response.json();
            displayResponse(result);
        }

        function displayResponse(result) {
            const responseDiv = document.getElementById('response');
            responseDiv.innerHTML = '<h2>Response</h2>';
            if (result.error) {
                responseDiv.innerHTML += `<p style="color: red;">${result.error}</p>`;
            } else {
                responseDiv.innerHTML += `<p>Filename: ${result.filename}</p>`;
                responseDiv.innerHTML += `<p>Keywords: ${result.keywords.join(', ')}</p>`;
                responseDiv.innerHTML += '<h3>PDF Links</h3>';
                const ul = document.createElement('ul');
                result.pdf_links.forEach(link => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = link;
                    a.textContent = link;
                    a.target = '_blank';
                    li.appendChild(a);
                    ul.appendChild(li);
                });
                responseDiv.appendChild(ul);
            }
        }
    </script>
</body>
</html>
