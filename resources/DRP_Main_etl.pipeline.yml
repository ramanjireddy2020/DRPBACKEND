# The main pipeline for DRP_Main

resources:
  pipelines:
    DRP_Main_etl:
      name: DRP_Main_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/DRP_Main_etl"

      libraries:
        - glob:
            include: ../src/DRP_Main_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
